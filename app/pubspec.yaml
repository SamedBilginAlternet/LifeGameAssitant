name: memoir_log
description: "MEMOIR_LOG — the diary that writes itself."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.5.6

  # State management + DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.7

  # Functional error handling — Either<Failure, T>
  fpdart: ^1.1.0

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # UI
  google_fonts: ^6.2.1
  animated_text_kit: ^4.2.2
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1

  # Audio (Phase 2 — wired but not yet used in Phase 0)
  audioplayers: ^6.1.0

  # OAuth (Phase 4.5+ — Spotify connect flow uses flutter_web_auth_2;
  # crypto generates the PKCE verifier/challenge.)
  flutter_web_auth_2: ^4.0.0
  crypto: ^3.0.5

  # Cover photo capture (Phase 4.5)
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  palette_generator: ^0.3.3+5

  # Voice notes (Phase 5)
  record: ^5.1.2
  permission_handler: ^11.3.1
  path_provider: ^2.1.4

  # HealthKit / Health Connect bridge (Phase 3 — auto-capture steps + calories)
  health: ^13.0.0

  # Backup export + share-card (Phase 7+)
  share_plus: ^10.1.2

  # Networking — used directly by integrations + cover_photo data sources.
  dio: ^5.7.0

  # Misc
  meta: ^1.15.0
  intl: ^0.20.2
  uuid: ^4.4.2

  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  custom_lint: '>=0.7.0 <0.7.4'
  riverpod_lint: '>=2.6.0 <2.6.5'

flutter:
  uses-material-design: true
  # Fonts come from google_fonts at runtime — no asset bundling needed.
  # Pixel icon sprites land in Phase 4.
  assets:
    - assets/audio/
    - assets/fonts/
    - shaders/scanlines.frag
    - shaders/dither.frag
